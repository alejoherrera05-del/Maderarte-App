<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#302721">
<meta name="description" content="Acceso a la aplicación interna de Maderarte.">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth-parity.css">
<title>Maderarte · Iniciar sesión</title>
</head>
<body class="auth-page">
<main class="auth-shell">
  <section class="auth-card">
    <aside class="auth-visual" aria-label="Maderarte"><img class="auth-watermark" src="/assets/brand/maderarte-logo-2026.webp" alt="" aria-hidden="true"><div class="auth-visual-copy"><strong>Muebles con un estilo diferente para cada cliente.</strong><p>Tu centro operativo, en un solo lugar.</p></div></aside>
    <section class="auth-access"><div class="auth-wrap">
      <div class="auth-brand"><img class="auth-brand-logo" src="/assets/brand/maderarte-logo-2026.webp" alt="Logo de Maderarte"><img class="auth-wordmark" src="/assets/brand/maderarte-wordmark-algerian.png" alt="MADERARTE"><div class="auth-system">Centro operativo</div></div>
      <div class="auth-notice" id="preview-notice" hidden>Vista local: entra sin consultar datos ni escribir en la base.</div>
      <div class="auth-heading"><h1>Bienvenido</h1><p>Ingresa con tu cuenta autorizada para continuar.</p></div>
      <form id="login-form" novalidate>
        <div class="auth-field"><label for="email">Correo</label><input class="auth-input" id="email" name="email" type="email" autocomplete="username" placeholder="tu@correo.com" required></div>
        <div class="auth-field"><label for="password">Contraseña</label><input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <div class="auth-options"><label class="auth-remember"><input id="remember" type="checkbox"> Mantener sesión</label><button class="auth-forgot" id="reset-password-button" type="button">Olvidé mi contraseña</button></div>
        <div class="auth-status" id="form-message" role="alert"></div>
        <button class="auth-submit" id="login-button" type="submit">Ingresar</button>
      </form>
      <div class="auth-secure">Acceso exclusivo para usuarios autorizados de Maderarte.</div>
    </div></section>
  </section>
</main>
<script type="module" src="/js/pages/login.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <meta name="description" content="Acceso a la aplicación interna de Maderarte.">
  <title>Iniciar sesión · Maderarte App</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/refinement.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel">
      <div class="login-card">
        <div class="login-brand-lockup">
          <img class="login-brand-logo" src="/assets/brand/maderarte-logo-2026.webp" alt="Logo de Maderarte">
          <span class="login-brand-copy"><img class="login-brand-wordmark" src="/assets/brand/maderarte-wordmark-algerian.png" alt="MADERARTE"><span>Centro operativo</span></span>
        </div>
        <div class="preview-notice" id="preview-notice" hidden>Vista local: entra sin consultar datos ni escribir en la base.</div>
        <h1>Bienvenido</h1>
        <p>Ingresa con tu cuenta autorizada de Maderarte.</p>
        <form class="login-form" id="login-form" novalidate>
          <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
          <div class="form-row"><label class="checkbox-row"><input id="remember" type="checkbox"> Mantener sesión en este dispositivo</label><button class="text-button" id="reset-password-button" type="button">Olvidé mi contraseña</button></div>
          <div class="form-message" id="form-message" role="alert"></div>
          <button class="button primary" id="login-button" type="submit">Ingresar</button>
        </form>
        <small class="login-help">El acceso es exclusivo para usuarios autorizados.</small>
      </div>
    </section>
    <aside class="login-visual" aria-label="Maderarte">
      <div class="login-visual-copy"><strong>Muebles con un estilo diferente para cada cliente.</strong><p>Centro operativo Maderarte.</p></div>
    </aside>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>

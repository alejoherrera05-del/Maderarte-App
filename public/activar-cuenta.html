<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#302721">
<meta name="description" content="Activación de una cuenta autorizada de Maderarte.">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth-parity.css">
<title>Maderarte · Activar acceso</title>
</head>
<body class="auth-page">
<main class="auth-shell">
  <section class="auth-card auth-card-single">
    <div class="auth-brand"><img class="auth-brand-logo" src="/assets/brand/maderarte-logo-2026.webp" alt="Logo de Maderarte"><img class="auth-wordmark" src="/assets/brand/maderarte-wordmark-algerian.png" alt="MADERARTE"><div class="auth-system">Activación segura</div></div>
    <div class="auth-heading" id="activation-state"><h1>Validando invitación</h1><p>Estamos comprobando que este acceso siga vigente.</p></div>
    <form id="activation-form" hidden novalidate>
      <div class="auth-heading"><h1 id="activation-name">Usuario Maderarte</h1><p>Rol asignado: <strong id="activation-role">USUARIO</strong></p></div>
      <div class="auth-field"><label for="activation-email">Correo autorizado</label><input class="auth-input" id="activation-email" type="email" readonly></div>
      <div class="auth-field"><label for="activation-password">Nueva contraseña</label><input class="auth-input" id="activation-password" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required></div>
      <div class="auth-field"><label for="activation-confirm">Repetir contraseña</label><input class="auth-input" id="activation-confirm" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="auth-options"><label class="auth-remember"><input id="activation-remember" type="checkbox"> Mantener sesión</label></div>
      <div class="auth-status" id="activation-message" role="alert"></div>
      <button class="auth-submit" id="activation-button" type="submit">Activar mi cuenta</button>
    </form>
    <a class="auth-back" href="/login.html">Volver al inicio de sesión</a>
  </section>
</main>
<script type="module" src="/js/pages/activar-cuenta.js"></script>
</body>
</html>

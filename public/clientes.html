<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f7">
  <meta name="description" content="Consulta de clientes de Maderarte.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/clientes-parity.css">
  <title>Maderarte · Clientes</title>
<link rel="stylesheet" href="/css/maddy-entrance.css?v=1"></head>
<body class="clients-page maddy-entry-page">
  <main id="clients-app" class="clients-app" hidden>
<section id="clients-search-screen" class="maddy-entrance" aria-labelledby="clients-cover-title">
  <header class="maddy-entrance-header">
    <a class="maddy-entrance-back" href="/index.html" aria-label="Volver al inicio"><img src="/assets/icons/arrow-left.svg" alt=""></a>
    <div class="maddy-entrance-brand" aria-label="Maderarte"><img src="/assets/brand/maderarte-logo-2026.webp" alt=""><img src="/assets/brand/maderarte-wordmark-algerian.png" alt="Maderarte"></div>
  </header>
  <div class="maddy-entrance-content">
    <p class="maddy-entrance-eyebrow">Maddy / Clientes</p><h1 id="clients-cover-title">Clientes</h1>
    <form id="clients-search-form" class="clients-search-form" role="search" autocomplete="off"><div class="clients-search-field"><img src="/assets/icons/magnifying-glass.svg" alt=""><input id="clients-search-input" type="search" inputmode="search" placeholder="Nombre o cédula" aria-label="Buscar cliente" maxlength="120"><button type="submit" aria-label="Buscar"><img src="/assets/icons/arrow-right.svg" alt=""></button></div><p id="clients-search-message" class="clients-search-message" role="status"></p><div id="clients-suggestions" class="clients-suggestions" aria-label="Clientes encontrados" hidden></div></form>
  </div>
  <div class="maddy-entrance-art" aria-hidden="true"><div class="maddy-entrance-folio"></div><img class="maddy-entrance-signature" src="/assets/brand/maddy-by-maderarte.svg" alt=""><img class="maddy-entrance-character" src="/assets/brand/maddy-working-approved.webp" alt="" width="420" height="560" fetchpriority="high" decoding="async"></div>
</section>
    <section id="clients-result-screen" class="clients-result-screen" hidden aria-label="Expediente del cliente">
      <header class="clients-result-header">
        <div class="clients-result-header-inner">
          <button id="clients-result-back" class="clients-header-back" type="button" aria-label="Volver al inicio">
            <img src="/assets/icons/arrow-left.svg" alt="" aria-hidden="true">
          </button>
          <div class="clients-header-title">
            <img src="/assets/brand/maderarte-logo-2026.webp" alt="" aria-hidden="true">
            <span>Clientes</span>
          </div>
          <button id="clients-new-search" class="clients-new-search" type="button">Nueva búsqueda</button>
        </div>
      </header>

      <div class="clients-result-shell">
        <div id="clients-result-content" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/pages/clientes.js?v=entrance-1"></script>
</body>
</html>

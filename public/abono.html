<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Recibos de caja · Maderarte App</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/recibos.css"><link rel="stylesheet" href="/css/owner-sandbox.css?v=sandbox-1"></head>
<body class="receipt-page"><main id="receipt-app" hidden>
<a id="receipt-back" class="receipt-back" href="/index.html" aria-label="Volver al inicio"><img src="/assets/icons/arrow-left.svg" alt=""></a>
<article class="receipt-sheet"><header class="receipt-brand"><div><img src="/assets/brand/maderarte-logo-2026.webp" alt="Maderarte"><img src="/assets/brand/maderarte-wordmark-algerian.png" alt="MADERARTE"></div><p id="receipt-company"></p></header>
<div class="receipt-body"><div class="receipt-heading"><span>Pagos de la orden</span><h1>Recibos de caja</h1><p id="receipt-mode">Consulta una orden y revisa su historial.</p></div>
<section id="receipt-entry"><form id="receipt-search-form" role="search"><label for="receipt-query">Orden de pedido o cliente</label><div class="receipt-search"><input id="receipt-query" autocomplete="off" placeholder="Número de OP, nombre o cédula" maxlength="120"><button type="submit">Buscar</button></div></form><p id="receipt-search-status" role="status"></p><div id="receipt-results" class="receipt-results"></div>
<section id="receipt-account" hidden aria-label="Cuenta de la orden"><div class="receipt-client"><h2 id="receipt-client-name"></h2><a id="receipt-order-link"></a></div><dl class="receipt-totals"><div><dt>Total de la orden</dt><dd id="receipt-total"></dd></div><div><dt>Pagado</dt><dd id="receipt-paid"></dd></div><div><dt>Saldo actual</dt><dd id="receipt-balance"></dd></div></dl>
<h2 class="receipt-section-title">Historial de pagos</h2><div id="receipt-history"></div>
<form id="receipt-form" novalidate><fieldset id="receipt-fields"><legend>Nuevo abono</legend><label for="receipt-amount">Valor recibido</label><input id="receipt-amount" class="receipt-amount" type="text" inputmode="numeric" placeholder="$ 0" autocomplete="off" required>
<label for="receipt-method">Medio de pago</label><select id="receipt-method" required><option value="">Seleccionar</option><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option><option value="TARJETA">Tarjeta</option><option value="ADDI">Addi</option></select>
<label for="receipt-concept">Concepto del recibo</label><textarea id="receipt-concept" maxlength="500" rows="2" placeholder="Abono a la orden de pedido" required></textarea><p class="receipt-help">Este concepto aparece en el recibo del cliente.</p>
<label for="receipt-reference">Referencia del pago (opcional)</label><input id="receipt-reference" maxlength="160" autocomplete="off">
<details><summary>Nota interna (opcional)</summary><label for="receipt-internal">Detalle para el equipo</label><textarea id="receipt-internal" rows="2" maxlength="1000"></textarea><p class="receipt-help">No aparece en el recibo del cliente.</p></details>
<p class="receipt-new-balance">Saldo después de este abono <strong id="receipt-next-balance">—</strong></p><p id="receipt-error" role="alert"></p><button id="receipt-submit" class="receipt-primary" type="submit" disabled>Guardar recibo de caja</button></fieldset></form></section></section>
<section id="receipt-result" hidden aria-label="Recibo registrado"></section><section id="receipt-recovery" hidden role="status" aria-live="polite"></section>
</div><footer class="receipt-footer"><img src="/assets/brand/maddy-by-maderarte.svg" alt="Maddy by Maderarte"><span id="receipt-version"></span></footer></article></main><script type="module" src="/js/pages/abono.js"></script></body></html>

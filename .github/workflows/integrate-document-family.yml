name: Integrate reviewed document family
on:
  push:
    branches: [fix/order-progress-refined-pdf]
    paths: ['tools/apply-document-family.py']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'alejoherrera05-del/Maderarte-App'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply-document-family.py
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0 pillow==11.3.0
      - run: python scripts/document_family_visual_qa.py
      - name: Commit only tested application changes
        run: |
          git add public package.json docs/ORDER_PROGRESS_PDF_REFINEMENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unificar cotización y pedido con jerarquía tipográfica delicada'
          git push origin HEAD:fix/order-progress-refined-pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-family-integration
          path: artifacts/document-family/
          retention-days: 7

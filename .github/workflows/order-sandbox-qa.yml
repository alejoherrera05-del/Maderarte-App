name: Owner order sandbox QA
on:
  push:
    branches: [feat/owner-order-sandbox]
  pull_request:
    paths:
      - 'apps-script/**'
      - 'functions/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/order-sandbox-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0 pillow==11.3.0
      - name: Formulario, Worker y Cerebro originales con Google simulado
        run: python scripts/owner_sandbox_browser_qa.py
      - run: node scripts/export-cerebro.mjs
      - name: Fuente exacta de la revisión
        if: always()
        run: |
          mkdir -p artifacts/owner-sandbox
          git rev-parse HEAD > artifacts/owner-sandbox/COMMIT.txt
          git archive --format=zip HEAD > artifacts/owner-sandbox/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-sandbox-qa
          path: |
            artifacts/owner-sandbox/
            dist/cerebro-manual/
          retention-days: 7

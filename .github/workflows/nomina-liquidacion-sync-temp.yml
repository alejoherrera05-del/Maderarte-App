name: Nomina liquidation sync temp

on:
  push:
    branches: [ux/nomina-liquidacion-automatica]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nomina-liquidacion-automatica
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sincronizar reglas y release
        run: |
          node scripts/sync-payroll-rules.mjs
          npm run release:stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/PayrollRules.gs public/release.json public/js/core/release.js
          git commit -m "chore(payroll): sync automatic liquidation rules and release"
          git push origin HEAD:ux/nomina-liquidacion-automatica

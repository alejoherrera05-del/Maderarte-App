name: Apply pinned document sources
on:
  push:
    branches: ['feat/order-documents-complete']
    paths:
      - '.github/workflows/apply-documents-update.yml'
      - 'tools/document-update-*.b64'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'alejoherrera05-del/Maderarte-App' && github.ref == 'refs/heads/feat/order-documents-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-documents-complete
      - name: Verify and apply exact code-only patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          text = ''.join(pathlib.Path(f'tools/document-update-{i:02}.b64').read_text().strip() for i in range(1,5))
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          expected = '42db122008edbd9f6e378cdc38ed9840bb7dacb2ece7408dcb2e0b0cf50bd017'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch hash mismatch; no files changed'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert '..' not in pathlib.PurePosixPath(path).parts
                  assert path.startswith(('public/', 'scripts/', 'functions/')) or path == 'package.json', path
          pathlib.Path('/tmp/maddy-documents.patch').write_bytes(patch)
          PY
          git apply --check /tmp/maddy-documents.patch
          git apply /tmp/maddy-documents.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public scripts functions package.json
          git commit -m 'Integrar fuentes documentales y pruebas desde parche verificado'
          git push origin HEAD:feat/order-documents-complete

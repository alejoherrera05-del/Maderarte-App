name: Revert Friendly QA Temp

on:
  push:
    branches: [revert/nomina-premium]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/nomina-premium
      - name: Alinear QA con UX simplificada
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/payroll_browser_qa.py')
          s=p.read_text()
          old="page.get_by_role('button',name='Revisar desglose',exact=True).click()"
          new="page.get_by_role('button',name='Sí, trabajó completa',exact=True).click();page.get_by_role('button',name='Ver total a pagar',exact=False).click()"
          if old not in s: raise SystemExit('No se encontró la primera revisión')
          s=s.replace(old,new,1)
          s=s.replace("expect(page.locator('#np-issue')).to_have_text('Dejar listo para pago')","expect(page.locator('#np-issue')).to_contain_text('Está correcto')",1)
          old_back="page.locator('#np-back').click()\n   page.locator('.np-novelties summary').filter(has_text='Permisos').click()"
          new_back="page.locator('#np-back').click();page.get_by_role('button',name='No, hubo una novedad',exact=True).click()\n   page.locator('.np-novelties summary').filter(has_text='Permisos').click()"
          if old_back not in s: raise SystemExit('No se encontró el retorno a novedades')
          s=s.replace(old_back,new_back,1)
          for _ in range(3):
            if old not in s: raise SystemExit('Falta una revisión esperada')
            s=s.replace(old,"page.get_by_role('button',name='Ver total a pagar',exact=False).click()",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/payroll_browser_qa.py
          git commit -m "test(payroll): align browser QA with restored friendly UX"
          git push origin HEAD:revert/nomina-premium

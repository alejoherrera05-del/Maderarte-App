name: Nomina feedback stamp temp

on:
  push:
    branches: [ux/nomina-feedback-performance]

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nomina-feedback-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sellar release de feedback de Nómina
        run: |
          npm run release:stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/release.json public/js/core/release.js
          git commit -m "chore(release): stamp payroll feedback performance"
          git push origin HEAD:ux/nomina-feedback-performance

name: Payroll commission QA fix temp

on:
  push:
    branches: [ux/nomina-premium-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nomina-premium-final
      - name: Corregir etiqueta de comisión en QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/payroll_browser_qa.py')
          s=p.read_text()
          old="page.get_by_role('button',name='Ver total a pagar',exact=False).click();expect(page.locator('.np-total')).to_contain_text('46.000')"
          new="page.get_by_role('button',name='Revisar desglose',exact=True).click();expect(page.locator('.np-total')).to_contain_text('46.000')"
          if old not in s: raise SystemExit('No se encontró el paso de comisión esperado')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/payroll_browser_qa.py
          git commit -m "test(payroll): keep commission review label in browser QA"
          git push origin HEAD:ux/nomina-premium-final

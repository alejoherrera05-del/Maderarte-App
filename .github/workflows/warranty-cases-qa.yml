name: Warranty repair QA
on:
  pull_request:
    paths: ['public/**', 'scripts/**', '.github/workflows/warranty-cases-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: node scripts/test-warranty-cases.mjs
      - run: python scripts/warranty_cases_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warranty-repair-qa
          path: |
            artifacts/warranty-cases/
            artifacts/warranty-documents/



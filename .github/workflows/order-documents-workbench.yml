name: Integrar lote documental de trabajo
on:
  push:
    branches: [feat/order-media-documents]
    paths: [scripts/order-documents-patch.b64]
permissions:
  contents: write
concurrency:
  group: order-documents-workbench
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-media-documents
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar únicamente el lote de código identificado
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          raw=zlib.decompress(base64.b64decode(pathlib.Path('scripts/order-documents-patch.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '76d1ac272511043173a185a257683e10fd79749a6ab21a881eecc847938b42d5'
          data=json.loads(raw)
          assert data['version']==1
          subprocess.run(['git','merge-base','--is-ancestor',data['base'],'HEAD'],check=True)
          for name, expected in data['before'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(('apps-script/','functions/api/','public/','scripts/')) or name in ('package.json','wrangler.toml')
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==expected, name
          patch=pathlib.Path('/tmp/order-documents.patch');patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==set(data['before']), actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrar fotos, Drive reservado, PDF aprobado y recuperación documental'
          git push origin HEAD:feat/order-media-documents
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0 pillow==11.3.0
      - name: PDF real del renderizador aprobado con datos sintéticos
        run: python scripts/order_document_render_qa.py
      - name: Regresión del formulario y su recuperación
        run: python scripts/order_save_browser_qa.py
      - name: Exportar Cerebro completo desde el commit aplicado
        run: node scripts/export-cerebro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-documents-workbench
          path: |
            artifacts/order-documents/
            artifacts/order-save-browser/
            dist/cerebro-manual/
          if-no-files-found: warn

name: Payroll browser QA update temp

on:
  push:
    branches: [ux/nomina-premium-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nomina-premium-final
      - name: Actualizar QA de navegador para la UX vigente
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/payroll_browser_qa.py')
          s=p.read_text()
          old="page.goto('http://127.0.0.1:4173/nomina.html?preview=1');expect(page.locator('.np-summary')).to_be_visible()"
          new="page.goto('http://127.0.0.1:4173/nomina.html?preview=1');expect(page.locator('.np-summary')).to_be_visible();expect(page.locator('.np-premium-hero')).to_be_visible();expect(page.locator('#np-new')).not_to_be_visible()"
          if old not in s: raise SystemExit('No se encontró la entrada inicial de Nómina')
          s=s.replace(old,new,1)
          old="page.get_by_role('button',name='Revisar desglose',exact=True).click()"
          new="page.get_by_role('button',name='Sí, trabajó completa',exact=True).click();page.get_by_role('button',name='Ver total a pagar',exact=False).click()"
          if old not in s: raise SystemExit('No se encontró la primera revisión')
          s=s.replace(old,new,1)
          s=s.replace("expect(page.locator('#np-issue')).to_have_text('Dejar listo para pago')","expect(page.locator('#np-issue')).to_contain_text('Está correcto')",1)
          old="page.locator('#np-back').click()\n   page.locator('.np-novelties summary').filter(has_text='Permisos').click()"
          new="page.locator('#np-back').click();page.get_by_role('button',name='No, hubo una novedad',exact=True).click()\n   page.locator('.np-novelties summary').filter(has_text='Permisos').click()"
          if old not in s: raise SystemExit('No se encontró el retorno a novedades')
          s=s.replace(old,new,1)
          old="page.get_by_role('button',name='Revisar desglose',exact=True).click()"
          if old not in s: raise SystemExit('No se encontró la revisión con novedad')
          s=s.replace(old,"page.get_by_role('button',name='Ver total a pagar',exact=False).click()",1)
          if old not in s: raise SystemExit('No se encontró la revisión de comisión')
          s=s.replace(old,"page.get_by_role('button',name='Ver total a pagar',exact=False).click()",1)
          old="page.goto('http://127.0.0.1:4173/nomina.html?preview=1');page.locator('#np-new').click()"
          new="page.goto('http://127.0.0.1:4173/nomina.html?preview=1');page.locator('.np-premium-menu-trigger').click();page.locator('[data-premium-action=other]').click()"
          if old not in s: raise SystemExit('No se encontró el acceso a otro comprobante')
          s=s.replace(old,new,1)
          if old.replace("page.goto('http://127.0.0.1:4173/nomina.html?preview=1');page.locator('#np-new').click()","") in []: pass
          old_review="page.get_by_role('button',name='Revisar desglose',exact=True).click()"
          if old_review not in s: raise SystemExit('No se encontró la revisión de días manuales')
          s=s.replace(old_review,"page.get_by_role('button',name='Ver total a pagar',exact=False).click()",1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/payroll_browser_qa.py
          git commit -m "test(payroll): follow guided premium browser flow"
          git push origin HEAD:ux/nomina-premium-final

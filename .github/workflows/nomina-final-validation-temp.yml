name: Nomina final validation temp

on:
  push:
    branches: [ux/nomina-simple]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ux/nomina-simple
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar suite completa
        run: npm test
      - name: Validar Cloudflare sin publicar
        run: npx wrangler deploy --dry-run

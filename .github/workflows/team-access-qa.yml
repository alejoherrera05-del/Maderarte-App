name: Team access QA
on:
  pull_request:
    paths: ['public/**', 'apps-script/**', 'scripts/**', '.github/workflows/team-access-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: node scripts/test-team-access.mjs
      - run: python scripts/team_access_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-access-qa
          path: artifacts/team-access/

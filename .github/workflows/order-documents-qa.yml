name: Order documents QA
on:
  pull_request:
    paths:
      - 'public/**'
      - 'apps-script/**'
      - 'worker/**'
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/order-documents-qa.yml'
      - 'docs/ORDER_DOCUMENTS_IMPLEMENTATION.md'
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0
      - name: Formulario y Cerebro reales con transporte Google sintético
        run: python scripts/order_documents_browser_qa.py
      - run: node scripts/export-cerebro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-documents-evidence
          path: |
            artifacts/order-documents/
            dist/cerebro-manual/
          if-no-files-found: warn

name: Order documents QA
on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'functions/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'wrangler.toml'
      - '.github/workflows/order-documents-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The PDFs returned by Browser Run identify Chromium 128.
      - run: pip install playwright==1.46.0 pypdf==5.9.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Firma y pie con la versión del motor publicado
        run: python scripts/order_document_render_qa.py
        env:
          QA_BUNDLED_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-documents-chromium128
          path: artifacts/order-documents/
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0 pillow==11.3.0
      - name: PDF aprobado, CSP, anexo y fotografías inválidas
        run: python scripts/order_document_render_qa.py
      - name: Formulario con fotos, pérdida de respuesta y reapertura (API simulada)
        run: python scripts/order_documents_browser_qa.py
      - name: Exportar Cerebro del commit verificado
        run: node scripts/export-cerebro.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-documents-qa
          path: |
            artifacts/order-documents/
            dist/cerebro-manual/
          if-no-files-found: warn

name: Order save QA

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - 'public/js/core/order-*.js'
      - 'public/js/pages/cotizacion.js'
      - 'scripts/test-order*.mjs'
      - 'docs/CHECKPOINT_2026-09-07_ORDER_SAVE.md'
      - '.github/workflows/order-save-qa.yml'

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify all foundation and order tests
        run: npm test
      - name: Package reproducible code-only checkpoint
        run: |
          mkdir -p /tmp/order-save-qa
          git rev-parse HEAD > /tmp/order-save-qa/COMMIT.txt
          git archive --format=zip --output=/tmp/order-save-qa/source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: order-save-code-checkpoint
          path: /tmp/order-save-qa/
          retention-days: 3
          if-no-files-found: error

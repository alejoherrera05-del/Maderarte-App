name: Integrar ensayo de propietario
on:
  push:
    branches: [feat/owner-order-sandbox]
    paths: ['tools/owner-sandbox-stage.py']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'alejoherrera05-del/Maderarte-App' && github.ref == 'refs/heads/feat/owner-order-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-order-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar únicamente el lote con hash y precondiciones
        run: |
          python3 tools/owner-sandbox-stage.py
          git rm tools/owner-sandbox-stage.py tools/owner-sandbox-delta-*.b64 .github/workflows/owner-sandbox-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script public functions scripts docs package.json .github/workflows/order-sandbox-qa.yml
          git commit -m 'Completar interfaz y verificación del ensayo aislado sin activar producción'
          git push origin HEAD:feat/owner-order-sandbox
      - run: npm ci
      - run: npm test
      - run: pip install playwright==1.55.0 pypdf==5.9.0 pillow==11.3.0
      - run: python scripts/owner_sandbox_browser_qa.py
      - run: node scripts/export-cerebro.mjs
      - name: Fuente aplicada y evidencia del ensayo
        if: always()
        run: |
          mkdir -p artifacts/owner-sandbox
          git rev-parse HEAD > artifacts/owner-sandbox/COMMIT.txt
          git archive --format=zip HEAD > artifacts/owner-sandbox/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-sandbox-applied
          path: |
            artifacts/owner-sandbox/
            dist/cerebro-manual/
          retention-days: 7

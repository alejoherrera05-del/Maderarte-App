name: Integrar ensayo de propietario
on:
  push:
    branches: [feat/owner-order-sandbox]
    paths: ['tools/owner-sandbox-stage.py']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'alejoherrera05-del/Maderarte-App' && github.ref == 'refs/heads/feat/owner-order-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-order-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar transformaciones revisables
        run: |
          python3 tools/owner-sandbox-stage.py
          git rm tools/owner-sandbox-stage.py .github/workflows/owner-sandbox-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script public functions scripts docs package.json
          git commit -m 'Integrar contexto de prueba sin cambiar banderas de producción'
          git push origin HEAD:feat/owner-order-sandbox
      - run: npm ci
      - run: npm test
      - name: Fuente aplicada
        if: always()
        run: |
          mkdir -p artifacts/owner-sandbox
          git rev-parse HEAD > artifacts/owner-sandbox/COMMIT.txt
          git archive --format=zip HEAD > artifacts/owner-sandbox/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-sandbox-applied
          path: artifacts/owner-sandbox/
          retention-days: 7

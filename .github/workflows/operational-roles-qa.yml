name: Operational roles QA
on:
  pull_request:
    paths: ['apps-script/**', 'scripts/**', '.github/workflows/operational-roles-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/test-operational-roles.mjs
      - run: pip install playwright==1.55.0
      - run: python scripts/operational_roles_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: operational-roles-evidence
          path: artifacts/operational-roles/

name: Visual QA Cotización

on:
  pull_request:
    paths:
      - 'public/cotizacion.html'
      - 'public/css/cotizacion-*.css'
      - 'public/js/pages/cotizacion*.js'
      - 'public/js/core/company-profile.js'
      - 'scripts/capture-quote-preview.py'
      - '.github/workflows/quote-visual-qa.yml'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Selenium
        run: pip install selenium==4.35.0
      - name: Esperar preview y capturar documento
        env:
          QUOTE_PREVIEW_URL: https://etapa-4-paridad-homeeasy-maderarte-app.alejoherrera05.workers.dev/cotizacion.html?preview=1
        run: |
          for i in {1..12}; do
            if curl -fsS "$QUOTE_PREVIEW_URL" >/dev/null; then break; fi
            sleep 10
          done
          python scripts/capture-quote-preview.py
      - name: Publicar captura
        uses: actions/upload-artifact@v4
        with:
          name: cotizacion-visual-qa
          path: artifacts/cotizacion-preview.png
          if-no-files-found: error
